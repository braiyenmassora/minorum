<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Minorum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Funnel+Display:wght@600;700&family=Fira+Code:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    /* Colors below are Minorum's own tokens (app/globals.css --minorum-*),
       inlined here since this page is served standalone, outside the
       Next.js/Tailwind build. Keep these in sync if the palette changes. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100dvh;
      min-height: 100svh;
      background: #0f0f0f; /* --minorum-bg */
      color: #ffffff; /* --minorum-text-primary */
      font-family: Geist, ui-sans-serif, system-ui, -apple-system, sans-serif; /* --font-sans */
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      min-height: 100dvh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem max(1.25rem, env(safe-area-inset-right, 0px)) max(2rem, env(safe-area-inset-bottom, 0px))
        max(1.25rem, env(safe-area-inset-left, 0px));
    }

    .card {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 960px;
      min-height: 0;
      background: #171717; /* --minorum-surface */
      border: 1px solid #262626; /* --minorum-border */
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.6); /* --minorum-shadow-floating */
      animation: rise 0.4s ease-out both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }

    /* --- Left panel: a real "code on screen" photo, darkened/blurred so it
       recedes into black instead of sitting on top of it as a bright cutout. --- */
    .panel-left {
      position: relative;
      flex: 0 0 auto;
      height: 220px;
      overflow: hidden;
      background: #0f0f0f;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem;
    }
    .panel-left__photo {
      position: absolute;
      inset: -6%;
      width: 112%;
      height: 112%;
      object-fit: cover;
      object-position: center 40%;
      filter: brightness(0.75) saturate(0.95) blur(0.5px);
    }
    .panel-left__scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 15, 15, 0.35) 0%, rgba(15, 15, 15, 0.45) 40%, rgba(15, 15, 15, 0.96) 100%);
    }
    .brand {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .brand img {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      object-fit: cover;
    }
    .brand span {
      font-family: "Funnel Display", Geist, sans-serif; /* --font-display */
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.2px;
    }
    .tagline {
      position: relative;
      font-family: "Funnel Display", Geist, sans-serif;
      font-weight: 600;
      font-size: 17px;
      line-height: 1.35;
      letter-spacing: -0.2px;
      color: #ffffff;
    }

    /* --- Right panel: the form --- */
    .panel-right {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.75rem;
    }
    .form-inner {
      width: 100%;
      max-width: 20rem;
    }
    .greeting {
      font-size: 13px;
      font-weight: 500;
      color: #737373; /* --minorum-text-muted */
      text-align: left;
      margin-bottom: 0.35rem;
    }
    h1 {
      font-family: "Funnel Display", Geist, sans-serif;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: #ffffff;
      text-align: left;
    }
    .subtitle {
      margin-top: 0.4rem;
      font-size: 13.5px;
      line-height: 1.5;
      color: #a3a3a3; /* --minorum-text-secondary */
      text-align: left;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 1.5rem;
    }
    .field {
      display: block;
      border: 1px solid #262626; /* --minorum-border */
      border-radius: 10px;
      background: #1a1a1a; /* --minorum-assistant-bubble */
      padding: 0.4rem 0.75rem 0.5rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field:focus-within {
      border-color: #a3a3a3; /* --minorum-focus-ring */
      box-shadow: 0 0 0 3px rgba(163, 163, 163, 0.2);
    }
    .field span {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #737373;
      margin-bottom: 0.1rem;
    }
    .field input {
      width: 100%;
      border: 0;
      background: transparent;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      outline: none;
      padding: 0;
    }
    .field input::placeholder {
      color: #4d4d4d;
    }
    /* Chrome/Safari force a light background on autofilled fields — override
       it back to the dark theme instead of letting it flash white. */
    .field input:-webkit-autofill,
    .field input:-webkit-autofill:hover,
    .field input:-webkit-autofill:focus {
      -webkit-text-fill-color: #ffffff;
      -webkit-box-shadow: 0 0 0 1000px #1a1a1a inset;
      transition: background-color 99999s ease-in-out 0s;
    }
    button {
      height: 44px;
      margin-top: 0.5rem;
      border: 0;
      border-radius: 10px;
      background: #e5e5e5; /* --minorum-accent */
      color: #0f0f0f; /* --minorum-text-on-accent */
      font: inherit;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: default; }
    button:focus-visible,
    .field input:focus-visible {
      outline: 2px solid #a3a3a3;
      outline-offset: 2px;
    }
    .error {
      font-size: 13px;
      color: #ff4d4f; /* --minorum-error */
      min-height: 1.1rem;
      text-align: left;
    }

    /* --- Desktop: side-by-side, matching the fixed-card reference --- */
    @media (min-width: 720px) {
      .card {
        flex-direction: row;
        min-height: 580px;
      }
      .panel-left {
        height: auto;
        flex: 0 0 340px;
      }
      .tagline {
        font-size: 19px;
      }
      .panel-right {
        padding: 2.5rem 3rem;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <aside class="panel-left" aria-hidden="true">
        <img class="panel-left__photo" src="/hero-code.jpg" alt="" />
        <div class="panel-left__scrim"></div>
        <div class="brand">
          <img src="/logo.jpeg" alt="" />
          <span>Minorum</span>
        </div>
        <p class="tagline">Writes code, checks sources, and skips the sugarcoating.</p>
      </aside>

      <main class="panel-right">
        <div class="form-inner">
          <p class="greeting" id="greeting">Welcome back</p>
          <h1>Log in to Minorum</h1>
          <p class="subtitle">Answers fast. Judges your code a little.</p>

          <form id="gate" autocomplete="on">
            <label class="field">
              <span>Your name</span>
              <input
                id="full-name"
                name="full-name"
                type="text"
                required
                autofocus
                autocomplete="name"
                placeholder="Alex"
              />
            </label>
            <label class="field">
              <span>Password</span>
              <input
                id="password"
                name="password"
                type="password"
                required
                autocomplete="current-password"
                placeholder="••••••••"
              />
            </label>
            <button type="submit" id="login" disabled>Log in</button>
            <p class="error" id="error" aria-live="polite"></p>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script>
    const STORAGE = {
      apiBaseUrl: "api_base_url",
      apiKey: "api_key",
      modelName: "model_name",
      fullName: "full_name",
    };

    const form = document.getElementById("gate");
    const fullName = document.getElementById("full-name");
    const password = document.getElementById("password");
    const error = document.getElementById("error");
    const button = document.getElementById("login");
    const greeting = document.getElementById("greeting");

    function jakartaGreetingWord() {
      const hour = Number(
        new Intl.DateTimeFormat("en-US", {
          timeZone: "Asia/Jakarta",
          hour: "2-digit",
          hourCycle: "h23",
        }).format(new Date()),
      );
      if (hour >= 5 && hour < 11) return "Good morning";
      if (hour >= 11 && hour < 15) return "Good afternoon";
      if (hour >= 15 && hour < 18) return "Good evening";
      return "Good night";
    }

    function syncLoginEnabled() {
      button.disabled = password.value.trim().length === 0;
    }

    const savedName = localStorage.getItem(STORAGE.fullName) || "";
    fullName.value = savedName;
    const firstName = savedName.trim().split(/\s+/)[0];
    greeting.textContent = firstName
      ? `${jakartaGreetingWord()}, ${firstName}`
      : jakartaGreetingWord();

    password.addEventListener("input", syncLoginEnabled);
    syncLoginEnabled();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (password.value.trim().length === 0) {
        return;
      }
      error.textContent = "";
      button.disabled = true;
      const loginLabel = button.textContent;
      try {
        const name = fullName.value.trim();
        if (!name) {
          error.textContent = "Your Name required";
          return;
        }

        button.textContent = "Loading…";
        const response = await fetch("/api/gate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: password.value }),
          // Don't hang the button forever if the server stalls.
          signal: AbortSignal.timeout(20000),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || payload.ok !== true) {
          error.textContent =
            typeof payload.message === "string"
              ? payload.message
              : response.status === 401
                ? "Wrong password"
                : "Connection failed";
          if (error.textContent === "Wrong password") {
            password.select();
          }
          return;
        }

        const config = payload.config || {};
        if (!config.apiBaseUrl || !config.apiKey) {
          error.textContent = "Server API config missing";
          return;
        }

        localStorage.setItem(STORAGE.apiBaseUrl, config.apiBaseUrl);
        localStorage.setItem(STORAGE.apiKey, config.apiKey);
        localStorage.setItem(
          STORAGE.modelName,
          typeof config.modelName === "string" ? config.modelName : "",
        );
        localStorage.setItem(STORAGE.fullName, name);

        window.location.href = "/";
      } catch (err) {
        error.textContent =
          err && err.name === "TimeoutError"
            ? "Connection timed out"
            : err instanceof Error
              ? err.message
              : "Network error";
      } finally {
        button.textContent = loginLabel;
        syncLoginEnabled();
      }
    });
  </script>
</body>
</html>
